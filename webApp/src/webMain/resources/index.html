<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipSync</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
            <circle id="loader-track" cx="25" cy="25" r="20" stroke-width="4" fill="none"/>
            <circle id="loader-head" cx="25" cy="25" r="20" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
